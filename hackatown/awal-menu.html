<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Bilah Menu</title>
  <style>
    /* Tulis CSS di sini */
    * { box-sizing: border-box; }

:root {
  --navy: #2b2d6e;
  --abu: #f1f1f4;
}

body {
  margin: 0;
  font-family: "Poppins", sans-serif;
}

.header {
  display: flex;
  align-items: center;
  padding: 1rem 4.5rem;
}

.logo img {
  display: block;
  height: 3.25rem;     
  width: auto;
}

.menu {
  margin-left: auto;
  display: flex;
  gap: 1rem;
}

.menu a {
  color: var(--navy);
  font-size: 0.8125rem;
  font-weight: 500;
  text-decoration: none;
}
.menu a:hover         { text-decoration: underline; }
.menu a:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }

/* Keranjang + tombol Shop */
.aksi {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  margin-left: 3rem;   
}

.tombol-keranjang {
  display: grid;
  place-items: center;
  width: 2.25rem;
  height: 2.25rem;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--abu);
  cursor: pointer;
}
.tombol-keranjang img {
  width: 1rem;
  height: 1rem;
  object-fit: contain;
}
.tombol-keranjang:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }

.tombol {
  display: inline-block;
  padding: 0.6rem 1.9rem;
  border-radius: 0.25rem;
  font-size: 0.8125rem;
  font-weight: 600;
  text-decoration: none;
}
.tombol-gelap { background: var(--navy); color: #fff; }
.tombol-gelap:hover         { filter: brightness(1.2); }
.tombol-gelap:focus-visible { outline: 3px solid orange; outline-offset: 2px; }
  </style>
</head>
<body>
  <header class="header">
    <a href="#" class="logo">
      <img src="Glowmind.png" alt="GlowMind">
    </a>

    <nav class="menu">
      <a href="#about">About</a>
      <a href="#product">Product</a>
      <a href="#reviews">Reviews</a>
      <a href="#resources">Resources</a>
    </nav>

    <div class="aksi">
      <button class="tombol-keranjang" aria-label="Keranjang belanja">
        <img src="OIP.jpeg" alt="Tas">
      </button>
      <a href="#shop" class="tombol tombol-gelap">Shop</a>
    </div>
  </header>
</body>
</html>
